<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <script type="text/javascript" src='https://www.codeflying.net/others/codeflying_notice.js?v=1'></script>
    <title>%VITE_APP_NAME%</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #fff0f6 0%, #fffbe6 100%);
            font-family: "Inter", sans-serif;
        }

        /* 加载层容器 */
        #loader-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            background: radial-gradient(circle at center, #fff0f6 0%, #fffbe6 100%);
        }

        /* 发光环（粉黄渐变） */
        #loader {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid transparent;
            background: conic-gradient(from 0deg, #ff6bcb, #ffb347, #ffe259, #ff6bcb);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), black 0);
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), black 0);
            animation: spin 1.4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 107, 203, 0.6));
        }

        /* 中心能量点 */
        #loader::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            margin: -7px 0 0 -7px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6bcb, #ffb347);
            box-shadow:
                    0 0 10px rgba(255, 107, 203, 0.7),
                    0 0 20px rgba(255, 179, 71, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        #loader-text {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            color: #ff6bcb;
            background: linear-gradient(90deg, #ff6bcb, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            animation: fadeIn 0.8s ease-in-out 0.2s forwards;
            opacity: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .loaded #loader-wrapper {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="loader-wrapper">
        <div id="loader"></div>
        <p id="loader-text">Generated by CodeFlying AI</p>
    </div>
</div>

<script type="module" src="/src/main.js"></script>
<script>
    // 页面加载完成后移除加载动画
    window.addEventListener('load', () => {
        document.body.classList.add('loaded');
    });
</script>
</body>
</html>
